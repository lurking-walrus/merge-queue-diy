name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # No `secrets: inherit` — it would hand the called workflow every secret in
    # this repo. AUTOMERGE_TOKEN (a Dependabot secret) is passed by name so the
    # merge is made by a real identity and push workflows run on main.
    uses: lurking-walrus/gh-automation/.github/workflows/dependabot-auto-merge.yml@9755c5a968c76d19c7f54017d4bcd1b314810426 # main 2026-11-26
    with:
      # deploy.yml deploys on every push to main, and a merge made with
      # GITHUB_TOKEN would not trigger it. Without AUTOMERGE_TOKEN (a Dependabot
      # secret), fail and leave the PR for a hand merge instead.
      require-token: true
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
