name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # No `secrets: inherit` — it would hand the called workflow every secret in
    # this repo. AUTOMERGE_TOKEN (a Dependabot secret) is passed by name so the
    # merge is made by a real identity and push workflows run on main.
    uses: kornsour/gh-automation/.github/workflows/dependabot-auto-merge.yml@b3c9725939d515a545219990f226bcfb1b754af6 # v1.1.0
    with:
      # No push-triggered deploy or publish workflow exists in this repository,
      # so a merge made with GITHUB_TOKEN loses nothing. Set this back to true
      # (and add the AUTOMERGE_TOKEN secret) when a deploy-on-push workflow lands.
      require-token: false
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
