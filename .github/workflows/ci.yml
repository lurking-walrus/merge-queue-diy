name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Centralized, standardized CI shared across the template-derived repos.
    # See github.com/kornsour/gh-automation.
    uses: kornsour/gh-automation/.github/workflows/ci.yml@bc8fb0fa2cdaf3e16af7ec43bfddc84dfdd441f3 # v1.2.0
    with:
      migration-check: false

  adr-index:
    name: ADR index check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Unique ADR numbers, complete index
        run: scripts/check-adr-index.sh
