name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Centralized, standardized CI shared across the template-derived repos.
    # See github.com/lurking-walrus/gh-automation.
    uses: lurking-walrus/gh-automation/.github/workflows/ci.yml@9755c5a968c76d19c7f54017d4bcd1b314810426 # main 2026-11-26
    with:
      migration-check: false

  adr-index:
    name: ADR index check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Unique ADR numbers, complete index
        run: scripts/check-adr-index.sh
